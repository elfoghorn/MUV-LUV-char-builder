<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e1a25">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UNTSF-COMM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>UNTSF-COMM</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Special+Elite&display=swap">
<style>
:root {
  /* ================= UX-STD-001 design tokens (single source of truth) =================
     Named tokens carry the spec palette; the dark values below are the default theme.
     Light-mode viewers get a daylight rendition of the same names. */
  color-scheme: light;
  --command-950: #e8edf1; --command-900: #dde5ec; --steel-800: #eef2f5; --steel-700: #f7f9fb; --steel-600: #c4cfd8;
  --military-blue: #3e6684; --steel-blue: #4d6475; --text-primary: #101d2a; --text-secondary: #4c5b67;
  --status-operational: #3f7259; --status-warning: #93641c; --status-critical: #9e3a3a;
  --status-operational-text: #376650; --status-warning-text: #835816; --status-critical-text: #9e3a3a;
  --ok-soft: #d8e9df; --warn-soft: #f1e2c6; --bad-soft: #f1d8d8; --accent-soft: #d5e1ea; --action-bg: #3e6684;
  --sea: #d2dde6; --land: #f4f7f9; --land-line: #8fa3b3; --grid: rgba(62,102,132,.12);
  --z1: #3f7259; --z2: #67823f; --z3: #a87a26; --z4: #b8622f; --z5: #9e3a3a;

  /* Layout */
  --sidebar-width: 240px; --sidebar-collapsed: 68px; --header-height: 64px; --content-padding: 28px; --content-max: 1600px;
  /* Borders and corners */
  --border-default: var(--steel-600); --radius-card: 6px; --radius-control: 4px;
  /* Type scale */
  --fs-title: 28px; --fs-section: 20px; --fs-panel: 16px; --fs-body: 14px; --fs-secondary: 12px; --fs-meta: 11px;
  --font-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-cond: "Rajdhani", "Arial Narrow", "Roboto Condensed", "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;

  /* Semantic aliases used by components (all derive from the named tokens) */
  --bg: var(--command-950); --sidebar: var(--command-900); --panel: var(--steel-700); --panel-2: var(--steel-800); --inset: var(--steel-800);
  --line: var(--border-default); --line-strong: var(--steel-blue); --text: var(--text-primary); --muted: var(--text-secondary); --faint: var(--text-secondary);
  --accent: var(--steel-blue); --accent-strong: var(--action-bg); --accent-text: #ffffff; --nav-active: var(--military-blue);
  --steel: var(--steel-blue); --ok: var(--status-operational-text); --warn: var(--status-warning-text); --bad: var(--status-critical-text); --authority: var(--status-warning);
  /* The spec hex values stay the canonical status colours; the -text tints are the same hues lifted (dark) or deepened (light) to meet WCAG AA as small text. */
  --bar-track: var(--steel-800); --bar-base: var(--military-blue); --shadow: none; --cut: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --command-950: #101D2A; --command-900: #142433; --steel-800: #192B3A; --steel-700: #243849; --steel-600: #344E62;
    --military-blue: #547D9B; --steel-blue: #8DA6B8; --text-primary: #E5EDF3; --text-secondary: #91A0AB;
    --status-operational: #5D9278; --status-warning: #D39A42; --status-critical: #B94B4B;
    --status-operational-text: #7FB89B; --status-warning-text: #D39A42; --status-critical-text: #E58A8A;
    --ok-soft: #1f3a30; --warn-soft: #3a2e1a; --bad-soft: #3d2023; --accent-soft: #22384a; --action-bg: #46708f;
    --sea: #0c1722; --land: #213547; --land-line: #3e566b; --grid: rgba(141,166,184,.10);
    --z1: #5d9278; --z2: #8ea65e; --z3: #d39a42; --z4: #d7773f; --z5: #c95454;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --command-950: #101D2A; --command-900: #142433; --steel-800: #192B3A; --steel-700: #243849; --steel-600: #344E62;
  --military-blue: #547D9B; --steel-blue: #8DA6B8; --text-primary: #E5EDF3; --text-secondary: #91A0AB;
  --status-operational: #5D9278; --status-warning: #D39A42; --status-critical: #B94B4B;
  --status-operational-text: #7FB89B; --status-warning-text: #D39A42; --status-critical-text: #E58A8A;
  --ok-soft: #1f3a30; --warn-soft: #3a2e1a; --bad-soft: #3d2023; --accent-soft: #22384a; --action-bg: #46708f;
  --sea: #0c1722; --land: #213547; --land-line: #3e566b; --grid: rgba(141,166,184,.10);
  --z1: #5d9278; --z2: #8ea65e; --z3: #d39a42; --z4: #d7773f; --z5: #c95454;
}

:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: var(--fs-body)/1.5 var(--font-body);
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sidebar); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- shell ---------- */
/* The shell fills the screen; the sidebar and main area each scroll on their own. */
#app { height: 100%; }
.shell { display: grid; grid-template-columns: var(--sidebar-width) 1fr; grid-template-rows: var(--header-height) 1fr; height: 100%; }
.shell.collapsed { grid-template-columns: var(--sidebar-collapsed) 1fr; }
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 18px; height: var(--header-height);
  background: var(--sidebar); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.brand small { font-weight: 400; color: var(--muted); letter-spacing: 0; margin-left: 8px; font-size: 13px; }
.topbar .spacer { flex: 1; }
.conn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
.conn.off i { background: var(--warn); }
.ident { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.ident select { max-width: 220px; }
.menu-btn { display: none; }

.sidebar { background: var(--sidebar); border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 10px 24px; }
.nav-group { margin-bottom: 18px; }
.nav-group h4 { margin: 0 8px 6px; font: 600 12px/1.4 var(--font-cond); color: var(--faint); letter-spacing: .02em; }
.nav-item { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 7px 10px; border: 0; background: none;
  text-align: left; border-radius: 3px; cursor: pointer; color: var(--text); font-size: 14px; }
.nav-item:hover { background: var(--panel-2); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--text); box-shadow: inset 3px 0 0 var(--nav-active); }
.nav-item .count { font: 600 12px var(--font-cond); background: var(--warn); color: var(--panel); border-radius: 8px; padding: 0 7px; }

.main, .sidebar { min-height: 0; overscroll-behavior: contain; }
.main { overflow-y: auto; padding: 20px var(--content-padding) 60px; min-width: 0; }
.main > .page { max-width: var(--content-max); margin: 0 auto; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font: 700 26px/1.15 var(--font-cond); letter-spacing: .01em; }
.page-head p { margin: 4px 0 0; color: var(--muted); max-width: 68ch; }

/* ---------- plates (primary panels) ---------- */
.plate { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-card); padding: 16px 18px; position: relative; }
.plate h2 { margin: 0 0 12px; font: 600 var(--fs-panel)/1.3 var(--font-cond); text-transform: uppercase; letter-spacing: .06em; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.plate h2 .sub { font: 400 13px var(--font-body); color: var(--muted); }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }

.metric { display: flex; flex-direction: column; gap: 2px; }
.metric b { font: 600 30px/1 var(--font-cond); }
.metric span { color: var(--muted); font-size: 13px; }
.metric.warn b { color: var(--warn); }

/* ---------- type, lists, tables ---------- */
.desig { font-family: var(--font-cond); font-weight: 700; letter-spacing: .02em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
table.data th { text-align: left; font: 600 13px var(--font-cond); color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
table.data td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.data tr.click { cursor: pointer; }
table.data tr.click:hover td { background: var(--panel-2); }
table.data td.num, table.data th.num { text-align: right; }
.scroll-x { overflow-x: auto; }
.empty { padding: 22px; text-align: center; color: var(--muted); border: 1px dashed var(--line-strong); }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.timeline li:last-child { border-bottom: 0; }
.timeline time { color: var(--muted); font-size: 13px; }
.timeline .narr { margin: 4px 0 0; color: var(--muted); font-style: italic; }

/* ---------- chips ---------- */
.chip { display: inline-flex; align-items: center; gap: 5px; font: 600 12px/1 var(--font-cond); padding: 4px 8px; border-radius: 2px;
  background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; letter-spacing: .02em; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border: 1px solid var(--line); background: var(--panel-2);
  border-radius: var(--radius-control); cursor: pointer; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--accent-text); font-weight: 600; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-left: 6px; padding-right: 6px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
input[type=text], input[type=number], select, textarea { background: var(--inset); border: 1px solid var(--line); border-radius: 3px;
  padding: 6px 9px; color: var(--text); min-width: 0; }
input[type=number] { width: 84px; }
textarea { min-height: 76px; resize: vertical; width: 100%; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form-grid .wide { grid-column: 1 / -1; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--text); }
.checks label { display: inline-flex; gap: 6px; align-items: center; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line-strong); margin-bottom: 16px; }
.tabs button { padding: 8px 14px; border: 0; background: none; cursor: pointer; color: var(--muted); font: 600 14px var(--font-cond);
  border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: flex-end; }

/* ---------- stat readout (the signature element) ---------- */
.stat { display: grid; grid-template-columns: 96px 1fr 70px; align-items: center; gap: 10px; padding: 5px 0; }
.stat .name { font-size: 14px; }
.stat .val { text-align: right; font: 600 18px/1 var(--font-cond); }
.stat .val small { display: block; font: 400 12px var(--font-body); color: var(--muted); margin-top: 2px; }
.stat .val small.up { color: var(--ok); } .stat .val small.down { color: var(--bad); }
.track { position: relative; height: 12px; background: var(--bar-track); border: 1px solid var(--line); }
.track .base { position: absolute; inset: 0 auto 0 0; background: var(--bar-base); }
.track .gain { position: absolute; top: 0; bottom: 0; background: var(--ok);
  background-image: repeating-linear-gradient(135deg, transparent 0 3px, rgba(255,255,255,.25) 3px 5px); }
.track .loss { position: absolute; top: 0; bottom: 0; background: var(--bad-soft); border-left: 1px solid var(--bad);
  background-image: repeating-linear-gradient(135deg, transparent 0 3px, var(--bad) 3px 4px); opacity: .9; }
.track .cap { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--warn); }
.track .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.rating { display: flex; align-items: baseline; gap: 10px; padding: 10px 0 4px; border-top: 1px solid var(--line); margin-top: 8px; }
.rating b { font: 700 40px/1 var(--font-cond); }
.mini .stat { grid-template-columns: 80px 1fr 34px; padding: 2px 0; }
.mini .stat .val { font-size: 15px; }
.mini .track { height: 7px; }

/* ---------- workshop ---------- */
.ws { display: grid; grid-template-columns: minmax(250px, 1fr) minmax(300px, 1.25fr) minmax(290px, 1.1fr); gap: 16px; align-items: start; }
.ws-tabs { display: none; }
.mount { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; width: 100%; text-align: left; padding: 9px 10px; margin-bottom: 6px;
  background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--line-strong); cursor: pointer; border-radius: 0 3px 3px 0; }
.mount:hover:not(:disabled) { border-color: var(--accent); }
.mount:disabled { cursor: default; }
.mount .lbl { font-size: 12px; color: var(--muted); }
.mount .item { font-weight: 600; font-size: 14px; }
.mount .item.none { color: var(--faint); font-weight: 400; }
.mount.filled { border-left-color: var(--accent); }
.mount.err { border-left-color: var(--bad); background: var(--bad-soft); }
.mount.appr { border-left-color: var(--warn); }
.schematic { width: 100%; height: auto; display: block; max-height: 380px; }
.schematic .frame { fill: none; stroke: var(--line-strong); stroke-width: 1.5; }
.schematic .frame-fill { fill: var(--panel-2); stroke: var(--line-strong); stroke-width: 1.2; }
.schematic .hp rect { fill: var(--panel); stroke: var(--line-strong); stroke-width: 1.5; }
.schematic .hp.filled rect { fill: var(--accent); stroke: var(--accent); }
.schematic .hp.err rect { fill: var(--bad); stroke: var(--bad); }
.schematic .hp.appr rect { stroke: var(--warn); stroke-width: 3; }
.schematic .hp text { font: 600 10px var(--font-cond); fill: var(--muted); }
.schematic .hp { cursor: pointer; }
.schematic .hp:focus-visible rect { stroke: var(--text); stroke-width: 3; }
.identity { text-align: center; margin-bottom: 4px; }
.identity .desig { font-size: 28px; line-height: 1.1; }
.identity .muted { font-size: 14px; }
.validation { padding: 10px 12px; border: 1px solid var(--line); margin-top: 12px; }
.validation.ok { border-color: var(--ok); background: var(--ok-soft); }
.validation.warn { border-color: var(--warn); background: var(--warn-soft); }
.validation.bad { border-color: var(--bad); background: var(--bad-soft); }
.validation h3 { margin: 0 0 6px; font: 700 15px var(--font-cond); }
.validation ul { margin: 0; padding-left: 18px; font-size: 13px; }
.validation li { margin: 3px 0; }
.frozen-note { font-size: 13px; color: var(--muted); margin-top: 8px; }

/* ---------- hangar ---------- */
.hangar { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.tsf-card .serial { font: 600 13px var(--font-cond); color: var(--muted); }
.tsf-card .desig { font-size: 22px; margin: 2px 0 2px; }
.tsf-card .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.tsf-card .rate { font: 700 28px/1 var(--font-cond); text-align: right; }
.tsf-card .rate small { display: block; font: 400 12px var(--font-body); color: var(--muted); }

/* ---------- drawer, modal, toast ---------- */
.scrim { position: fixed; inset: 0; background: rgba(8,14,22,.45); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--panel); z-index: 21; display: flex; flex-direction: column;
  border-left: 1px solid var(--line-strong); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
.drawer header h2 { margin: 0; font: 700 20px/1.2 var(--font-cond); }
.drawer header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.drawer .body { overflow-y: auto; padding: 16px 20px; flex: 1; }
.drawer footer { padding: 12px 20px; border-top: 1px solid var(--line); }
.drawer section { margin-bottom: 20px; }
.drawer section h3 { margin: 0 0 8px; font: 600 15px var(--font-cond); }
.pick { display: block; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 6px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; border-radius: 3px; }
.pick:hover:not(:disabled) { border-color: var(--accent); }
.pick:disabled { cursor: not-allowed; opacity: .78; background: transparent; }
.pick .top { display: flex; justify-content: space-between; gap: 8px; }
.pick .why { display: block; margin-top: 4px; font: 600 12px var(--font-cond); color: var(--bad); letter-spacing: .02em; }
.pick .mods { font-size: 12px; color: var(--muted); }
.modal { position: fixed; z-index: 30; left: 50%; top: 30%; transform: translate(-50%, -30%); width: min(440px, calc(100% - 32px)); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 3px; font-size: 14px; max-width: calc(100% - 32px); }
.toast.bad { background: var(--bad); color: #fff; }
.mods-list { display: flex; flex-wrap: wrap; gap: 4px; }
.row-edit { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
.notice { padding: 12px 14px; border: 1px solid var(--warn); background: var(--warn-soft); margin-bottom: 16px; font-size: 14px; }
.diff td.changed { background: var(--warn-soft); }
.boot { display: grid; place-items: center; height: 100%; padding: 24px; text-align: center; }
.boot .plate { max-width: 460px; }

/* ---------- frame drawing and propulsion ---------- */
.schematic.framed { max-height: 600px; }
.frame-art { mix-blend-mode: multiply; }
:root[data-theme="dark"] .frame-art { filter: invert(1); mix-blend-mode: screen; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .frame-art { filter: invert(1); mix-blend-mode: screen; } }
.schematic.framed .hp rect { stroke-width: 3; }
.schematic.framed .hp text { font-weight: 700; fill: var(--text); paint-order: stroke; stroke: var(--panel); stroke-width: 6px; stroke-linejoin: round; }
.schematic .hp.engine.filled rect { fill: var(--steel); stroke: var(--steel); }
.schematic.placing { cursor: crosshair; }
.frame-grid { display: grid; grid-template-columns: minmax(0, 320px) 1fr; gap: 18px; align-items: start; }
.propulsion { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.propulsion h3 { margin: 0 0 8px; font: 600 15px var(--font-cond); }
.prop-figs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
.prop-figs b { display: block; font: 700 22px/1 var(--font-cond); }
.prop-figs span { font-size: 12px; color: var(--muted); }

/* ---------- BETA fronts, mission images, mount key ---------- */
.beta-zone { stroke: var(--z5); stroke-width: 1.2; stroke-dasharray: 5 3; stroke-opacity: .8; }

.front-halo { fill: none; stroke: var(--sea); stroke-width: 6; stroke-opacity: .7; stroke-linejoin: round; }
.draw-preview polyline, .draw-preview polygon { fill: var(--accent); fill-opacity: .15; stroke: var(--accent); stroke-width: 2.5; }
.draw-preview polyline { fill: none; }
.draw-preview circle { fill: var(--accent); }
.k-zone, .k-front { display: inline-block; width: 16px; height: 10px; margin: 0 5px 0 0; vertical-align: -1px; }
.k-zone { background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--z5) 35%, transparent) 0 2px, transparent 2px 5px); border: 1px dashed var(--z5); }
.k-front { height: 0; border-top: 3px dashed var(--z5); vertical-align: 3px; }
.mthumb { margin: -4px 0 12px; }
.mthumb svg { display: block; width: 100%; aspect-ratio: 2 / 1; height: auto; border: 1px solid var(--line-strong); background: var(--sea); }
.mthumb figcaption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.cap-key { display: inline-flex; align-items: center; gap: 4px; }
.mount-key { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 4px 12px; }
.mount-key .key-h { grid-column: 1 / -1; font: 600 13px var(--font-cond); color: var(--muted); margin-top: 6px; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.key-row { display: flex; align-items: flex-start; gap: 8px; width: 100%; text-align: left; padding: 5px 4px; border: 0; background: none; border-radius: 3px; }
button.key-row { cursor: pointer; } button.key-row:hover { background: var(--panel-2); }
.key-n { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--font-cond);
  border: 2px solid var(--line-strong); color: var(--text); background: var(--panel); }
.key-n.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.key-n.on.sys { background: var(--steel); border-color: var(--steel); color: var(--panel); }
.key-n.err { background: var(--bad); border-color: var(--bad); color: #fff; } .key-n.appr { box-shadow: 0 0 0 2px var(--warn); }
.key-t { display: flex; flex-direction: column; min-width: 0; }
.key-l { font-size: 12px; color: var(--muted); }
.key-i { font-size: 14px; font-weight: 600; line-height: 1.25; }
.key-i.none { font-weight: 400; color: var(--faint); }
.key-i em { font-style: normal; font-weight: 400; font-size: 12px; color: var(--muted); }
.schematic .hp circle { fill: var(--panel); stroke: var(--line-strong); stroke-width: 1.5; }
.schematic .hp.filled circle { fill: var(--accent); stroke: var(--accent); }
.schematic .hp.engine.filled circle { fill: var(--steel); stroke: var(--steel); }
.schematic .hp.err circle { fill: var(--bad); stroke: var(--bad); }
.schematic .hp.appr circle { stroke: var(--warn); stroke-width: 3; }
.schematic .hp text.num { font-family: var(--font-cond); font-weight: 700; fill: var(--text); stroke: none; paint-order: normal; }
.schematic .hp.filled text.num, .schematic .hp.err text.num { fill: var(--accent-text); }
.schematic .hp.engine.filled text.num { fill: var(--panel); }
.schematic.framed .hp circle { stroke-width: 4; }
.parts-list { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 12px 0 0; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; }
.parts-list dt { color: var(--muted); }
.parts-list dd { margin: 0; font-weight: 600; }

/* ---------- operations map ---------- */
.ops-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
.mapwrap { position: relative; }
.worldmap { display: block; width: 100%; aspect-ratio: 2 / 1; height: auto; background: var(--sea); border: 1px solid var(--line-strong); touch-action: none; cursor: grab; user-select: none; }
.worldmap:active { cursor: grabbing; }
.mapwrap.placing .worldmap { cursor: crosshair; }
.worldmap .sea { fill: var(--sea); }
.worldmap .grat line { stroke: var(--grid); stroke-width: .6; vector-effect: non-scaling-stroke; }
.worldmap .grat line.eq { stroke-dasharray: 4 3; }
.worldmap .land { fill: var(--land); stroke: var(--land-line); stroke-width: .8; vector-effect: non-scaling-stroke; }
.worldmap .borders { fill: none; stroke: var(--land-line); stroke-width: .5; stroke-opacity: .55; }
.zone { cursor: pointer; }
.zone .area { fill-opacity: .16; stroke-width: 1.2; stroke-dasharray: 3 2; }
.zone .pin { stroke: var(--sea); stroke-width: 1.2; }
.zone.t1 .area, .zone.t1 .pin { fill: var(--z1); stroke: var(--z1); } .zone.t2 .area, .zone.t2 .pin { fill: var(--z2); stroke: var(--z2); }
.zone.t3 .area, .zone.t3 .pin { fill: var(--z3); stroke: var(--z3); } .zone.t4 .area, .zone.t4 .pin { fill: var(--z4); stroke: var(--z4); }
.zone.t5 .area, .zone.t5 .pin { fill: var(--z5); stroke: var(--z5); }
.zone .pin { stroke: var(--sea); }
.zone.cleared .area { fill-opacity: .05; }
.zone.mine .area { stroke-dasharray: none; stroke-width: 2.2; fill-opacity: .26; }
.zone .ring { fill: none; stroke: var(--text); stroke-width: 1.5; animation: ring 1.6s ease-out 1; }
.zone .lbl { fill: var(--text); font-family: var(--font-cond); font-weight: 600; paint-order: stroke; stroke: var(--sea); stroke-linejoin: round; }
.zone .badge { fill: var(--text); }
.zone .badge-t { fill: var(--bg); font-family: var(--font-cond); font-weight: 700; }
.zone:focus-visible .pin { stroke: var(--text); stroke-width: 3; }
@keyframes ring { from { stroke-opacity: 1; } to { stroke-opacity: .35; } }
.map-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.map-tools .btn { padding: 4px 10px; font-size: 13px; }
.map-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.lg { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; border-radius: 50%; }
.lg.t1 { background: var(--z1); } .lg.t2 { background: var(--z2); } .lg.t3 { background: var(--z3); } .lg.t4 { background: var(--z4); } .lg.t5 { background: var(--z5); }
.ops-side h3 { margin: 0 0 6px; font: 600 14px var(--font-cond); }
.ops-list { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow-y: auto; }
.link-row { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; padding: 7px 8px; border: 0; border-bottom: 1px solid var(--line); background: none; cursor: pointer; }
.link-row:hover, .link-row.on { background: var(--panel-2); }
.zone-info { margin-top: 10px; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--panel-2); font-size: 14px; }
.section-h { font: 600 var(--fs-section) var(--font-cond); margin: 22px 0 10px; text-transform: uppercase; letter-spacing: .05em; }
.mission .head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.mission { border-left: 4px solid var(--z3); }
.mission.t5 { border-left-color: var(--z5); } .mission.t4 { border-left-color: var(--z4); } .mission.t1, .mission.t2 { border-left-color: var(--z1); }
.assign { padding: 10px 12px; margin-bottom: 8px; }

/* ---------- pilots: insignia, portraits, enlistment ---------- */
.avatar { position: relative; display: inline-block; flex: none; }
.avatar > svg, .avatar > img { position: absolute; inset: 0; width: 100%; height: 100%; }
.avatar > img { object-fit: cover; border: 1px solid var(--line-strong); background: var(--panel-2); }
img.broken { display: none; }
.who { display: inline-flex; align-items: center; gap: 8px; }
.who-head { display: flex; align-items: center; gap: 14px; }
.portrait-slot { display: flex; flex-direction: column; align-items: flex-start; }
.review-id { display: flex; gap: 14px; align-items: center; }
.art { margin: -4px 0 12px; border: 1px solid var(--line); background: var(--panel-2); }
.art img { display: block; width: 100%; max-height: 220px; object-fit: contain; }
.art-row .art { max-width: 320px; }
.file-btn { position: relative; overflow: hidden; }

.swatches { display: flex; flex-wrap: wrap; gap: 6px; }

.chip-color { width: 22px; height: 22px; border-radius: 50%; display: block; }
.stepper { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 0 0 12px; margin: 0 0 16px; border-bottom: 1px solid var(--line); }
.stepper li { display: flex; align-items: center; gap: 6px; font: 600 14px var(--font-cond); color: var(--faint); }
.stepper li span { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line-strong); font-size: 12px; }
.stepper li.on { color: var(--text); } .stepper li.on span { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.stepper li.done span { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.buy { display: grid; grid-template-columns: minmax(140px, 1.2fr) auto minmax(80px, 1fr); gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.buy .btn { padding: 4px 9px; }
.buy-val { min-width: 34px; text-align: center; font: 700 20px var(--font-cond); }

/* ---------- UNTSF-COMM shell ---------- */

.dept { font: 600 11px var(--font-mono); letter-spacing: .04em; color: var(--steel); border: 1px solid var(--line-strong); padding: 1px 5px; border-radius: 2px; margin-right: 6px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); }

.brand-code { font: 700 20px/1 var(--font-cond); letter-spacing: .08em; }

.nav-group h4 { display: flex; align-items: center; gap: 2px; font: 600 12px var(--font-cond); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 6px 6px; }

.nav-group.authority .dept { color: var(--authority); border-color: var(--authority); }

h1, h2, h3, .page-head h1, .plate h2, .drawer header h2 { font-family: var(--font-cond); letter-spacing: .02em; }

.boot-card { max-width: 520px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.boot-mark { color: var(--steel); }
.boot-code { font: 700 34px/1 var(--font-cond); letter-spacing: .14em; }
.boot-name { font: 600 14px/1.4 var(--font-cond); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }

.boot-sec { font: 500 11px var(--font-mono); letter-spacing: .08em; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }

/* ---------- dashboard, assets, dossier, notifications ---------- */
.dash { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.asset-name { font: 600 16px var(--font-cond); letter-spacing: .14em; color: var(--muted); }

.spec dd { margin: 0; }
.assets { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 18px; }
.asset { display: grid; grid-template-columns: 150px 1fr; gap: 16px; padding: 16px; }
.asset-art { background: var(--inset); border: 1px solid var(--line); display: grid; place-items: center; min-height: 220px; overflow: hidden; color: var(--steel); }

  font: 600 12px var(--font-mono); letter-spacing: .08em; color: var(--muted); }
.dossier-band span:first-child { color: var(--text); }
.dossier { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: start; }
.dossier-id { position: sticky; top: 0; }
.dossier-ins { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.dossier-name { margin: 0; font: 700 34px/1.05 var(--font-cond); }
.dossier-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0; margin: 12px 0 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.dossier-f { padding: 8px 10px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }

/* ---------- UX-STD-001 shell ---------- */
.ico { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.logo { display: inline-flex; align-items: center; gap: 10px; color: var(--text); }
.logo .insignia-brand { color: var(--steel); }
.logo-primary .logo-un { display: block; font: 600 10px/1 var(--font-cond); letter-spacing: .2em; color: var(--muted); }
.logo-code { display: block; font: 700 21px/1.05 var(--font-cond); letter-spacing: .08em; }

.crumbline { font: 600 var(--fs-meta) var(--font-mono); letter-spacing: .1em; color: var(--muted); margin-bottom: 6px; }
.menu-wrap { position: relative; }

.shell.collapsed .nav-item { justify-content: center; padding: 9px 0; }

.shell.collapsed .sidebar { padding-left: 6px; padding-right: 6px; }
.nav-group.sysadmin { border-top: 1px solid var(--line); padding-top: 10px; }
.tabs .count { font: 600 10px var(--font-mono); background: var(--warn); color: #1b1408; border-radius: 8px; padding: 0 5px; }

/* ---------- components ---------- */
.sticky-filters { position: sticky; top: -20px; z-index: 5; background: var(--bg); padding: 8px 0; }
.pager { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 14px; }

  border-radius: var(--radius-card); padding: 12px; font: inherit; cursor: pointer; }

.eq-name { font: 600 16px/1.2 var(--font-cond); letter-spacing: .02em; }
.why-inline { color: var(--warn); }
.record-list { display: grid; gap: 12px; }
.record-card, .feedback-card { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--line-strong); border-radius: var(--radius-card); padding: 14px 16px; }
.feedback-card.warn { border-left-color: var(--warn); } .feedback-card.ok { border-left-color: var(--ok); }
.feedback-card { margin-bottom: 16px; }
.record-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.record-ref { font-family: var(--font-mono); font-weight: 500; font-size: 20px; margin: 4px 0 0; color: var(--text); }
